# Perfil "sandbox": back descartável para testar no navegador sem tocar no PostgreSQL.
# Sobe pela classe de teste SandboxApplication (mvnw test-compile spring-boot:test-run; configuração
# "backend-sandbox" do .claude/launch.json), que também força o H2 por argumento. Tudo some ao desligar.
server.port=8090
spring.datasource.url=jdbc:h2:mem:sandbox;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.auto_quote_keyword=true
# Regras reais (as de teste ficam só nos testes automatizados).
runarcana.rules.catalog=classpath:rules/criacao.json
runarcana.rules.heritages=classpath:rules/herancas.json
