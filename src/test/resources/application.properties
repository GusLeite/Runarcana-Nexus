# Testes usam H2 em memória, sem precisar do PostgreSQL local.
spring.datasource.url=jdbc:h2:mem:runarcana;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# "character" e "object" são palavras reservadas no H2
spring.jpa.properties.hibernate.auto_quote_keyword=true

# Catálogo de regras próprio dos testes (não muda quando as regras reais forem preenchidas).
runarcana.rules.catalog=classpath:rules/criacao-teste.json

runarcana.rules.heritages=classpath:rules/herancas-teste.json
runarcana.rules.traits=classpath:rules/tracos-teste.json
runarcana.rules.resources=classpath:rules/recursos-teste.json
