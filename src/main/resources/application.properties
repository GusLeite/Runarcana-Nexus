spring.application.name=Runarcana-Nexus

# Credenciais por variável de ambiente; em dev, num application-local.properties fora do Git (ver application-local.properties.example).
spring.config.import=optional:file:./application-local.properties
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/runarcana}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.servlet.context-path=/runarcana
