# Perfil de produção (SPRING_PROFILES_ACTIVE=prod): usa as variáveis DB_URL, DB_USERNAME, DB_PASSWORD e RUNARCANA_MASTER_PASSWORD.
spring.jpa.show-sql=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

runarcana.auth.master-password=${RUNARCANA_MASTER_PASSWORD:}

# A API fica atrás do proxy: o endereço real do cliente, usado no limite de login, vem no X-Forwarded-For.
server.forward-headers-strategy=native
