spring:
  application:
    name: runarcana-nexus
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/runarcana_nexus}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: ${DB_DRIVER_CLASS_NAME:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

server:
  error:
    include-message: always
